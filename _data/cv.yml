cv:
  name: Lirui Guo
  label: Postdoctoral Research Fellow in Human–Robot Interaction
  affiliation: Monash Robotics · ARC ITTC in Optimal Ageing · Monash University
  email: Lirui.Guo@monash.edu
  website: https://lirui3.github.io/
  scholar: https://scholar.google.com/citations?user=13uW1k0AAAAJ
  pdf: /assets/pdf/LiruiGuo_CV_Oct2026.pdf
  updated: October 2026
  summary: >-
    I study human-centred intelligent systems, from conversational AI in shared
    autonomous vehicles to adaptive human–robot interaction for optimal ageing.
    My PhD thesis at Monash University has been submitted for examination.

  sections:
    education:
      - title: PhD in Human–Computer Interaction for Intelligent Transportation Systems
        organization: Monash University
        period: 2022–Present
        detail: Supervised by Dr. Wynita Griggs and Dr. Michael Burke
        status: Thesis submitted for examination
        description: >-
          From perception to interaction: Psychological drivers and adaptive
          conversational agents for shared autonomous vehicles (SAVs)
        highlights:
          - label: Predict
            text: Developed predictive modelling and visual analytics frameworks to identify drivers of technology acceptance.
          - label: Interact
            text: Designed LLM-based SAV interfaces and studied 2,136 open-domain interactions with 50 participants.
          - label: Measure
            text: Developed and benchmarked automated methods for measuring dialogue attributes associated with perceived service quality.
          - label: Control
            text: Developed a closed-loop framework to steer LLM response behaviour towards more adaptive and stable interaction.
          - label: Research outputs
            text: One published Q1 journal article, one journal article under review, one IEEE ITSC paper, an open dataset, and a manuscript in preparation.
          - label: Thesis examination
            text: Both examiners rated all merit criteria Excellent or Exceptional and assessed the thesis as worthy of nomination for a thesis award.
      - title: B.Eng. (Honours) in Civil Engineering
        organization: Monash University
        period: 2017–2022
      - title: B.Com. in Business Analytics
        organization: Monash University
        period: 2017–2022

    research:
      - title: Postdoctoral Research Fellow — Human–Robot Interaction
        organization: Monash University
        period: Sep 2026–Present
        detail: Monash Robotics · ARC ITTC in Optimal Ageing · Supervisor Prof. Dana Kulić
        highlights:
          - Investigating how older adults' preferences, needs, and lived experiences can inform adaptive home robot behaviour.
          - Developing a MuJoCo simulation and evaluation pipeline for Reachy 2, including robot control, safety constraints, and exploration of pre-trained vision-language-action policies.
          - Working with robotics, design, and ageing researchers on participatory approaches and planned studies involving older adults.
      - title: Research Collaborator — AI in Engineering Education
        organization: Monash University
        period: 2024–Present
        detail: With Assoc. Prof. Nan Zheng, Assoc. Prof. Ye Lu, and Dr. Linxin Hua
        highlights:
          - Co-developed and trialled CivASK, a retrieval-augmented learning assistant for engineering students.
          - Contributed to a multi-agent evaluation framework that simulated 742 student inquiries and generated 374 test questions.
          - Applied prompt optimisation to technical problem-solving and analysed 6,072 student feedback comments to inform curriculum improvement.
          - Published a Q1 journal article and an AAEE 2024 conference paper; another journal article is under review.
      - title: Research Assistant
        organization: Monash University
        period: 2022–2023
        detail: Autonomous systems risk assessment research
        highlights:
          - Reviewed and synthesised research on risk assessment methodologies for autonomous system design.

